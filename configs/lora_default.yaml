# Defaults for the LoRA fine-tuning demo step.
# rank controls how many new numbers get added per adapted layer — the
# smaller this is relative to the base layer, the more dramatic the
# trainable-parameter comparison the app shows.

lora:
  rank: 4
  alpha: 8.0
  dropout: 0.0
  target_modules: [c_attn_q, c_attn_v]
  # 300 steps left this visibly undertrained: validation loss stalled around
  # 2.2 and the output was closer to noise than to the fine-tune text's
  # style. 1000 steps gets it to ~1.6 and starts spelling "shift log"
  # correctly on the bundled sample — steps are cheap here (a rank-4 adapter
  # on a 2KB corpus), so there's no reason to stop early.
  max_steps: 1000
  batch_size: 32
  learning_rate: 0.001
  warmup_steps: 100
  eval_interval: 50
  eval_iters: 10
  grad_clip: 1.0
  seed: 1337
